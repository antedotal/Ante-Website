<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          overflow: hidden;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
          color: #ffffff;
        }
        .bg-canvas {
          position: absolute;
          inset: 0;
          background: radial-gradient(circle at 75% 30%, #003a4a 0%, #002530 40%, #00151c 80%, #000d12 100%);
          z-index: 0;
        }
        .ambient-orb {
          position: absolute;
          border-radius: 50%;
          filter: blur(120px);
          pointer-events: none;
          opacity: 0.55;
        }
        .orb-1 {
          width: 700px;
          height: 700px;
          top: -120px;
          right: -50px;
          background: radial-gradient(circle, rgba(0, 164, 198, 0.45) 0%, rgba(35, 101, 151, 0) 70%);
        }
        .grid-overlay {
          position: absolute;
          inset: 0;
          background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                            linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
          background-size: 64px 64px;
          opacity: 0.7;
          z-index: 1;
        }
        .scene-container {
          position: absolute;
          inset: 0;
          z-index: 2;
          display: grid;
          grid-template-columns: 1.15fr 0.85fr;
          align-items: center;
          gap: 80px;
          padding: 80px 140px;
        }
        .badge {
          display: inline-flex;
          align-items: center;
          gap: 10px;
          padding: 10px 22px;
          border-radius: 9999px;
          background: rgba(0, 164, 198, 0.18);
          border: 1px solid rgba(0, 190, 230, 0.45);
          color: #38bdf8;
          font-size: 19px;
          font-weight: 700;
          letter-spacing: 0.12em;
          text-transform: uppercase;
          margin-bottom: 24px;
        }
        .badge-dot {
          width: 10px;
          height: 10px;
          border-radius: 50%;
          background: #00d2f8;
          box-shadow: 0 0 12px #00d2f8;
        }
        .headline-huge {
          font-size: 82px;
          font-weight: 800;
          line-height: 1.05;
          letter-spacing: -0.03em;
          color: #ffffff;
          margin-bottom: 24px;
        }
        .headline-accent {
          color: #38bdf8;
          text-shadow: 0 0 35px rgba(56, 189, 248, 0.35);
        }
        .steps-list {
          display: flex;
          flex-direction: column;
          gap: 20px;
          margin-top: 30px;
          max-width: 680px;
        }
        .step-item {
          display: flex;
          align-items: center;
          gap: 24px;
          padding: 18px 26px;
          border-radius: 20px;
          background: rgba(255, 255, 255, 0.05);
          border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .step-num {
          width: 48px;
          height: 48px;
          border-radius: 14px;
          background: #0284c7;
          color: #ffffff;
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 24px;
          font-weight: 800;
          flex-shrink: 0;
        }
        .step-text-title {
          font-size: 22px;
          font-weight: 700;
          color: #ffffff;
          margin-bottom: 2px;
        }
        .step-text-desc {
          font-size: 17px;
          color: #cbd5e1;
        }
        .phone-wrapper {
          display: flex;
          align-items: center;
          justify-content: center;
          position: relative;
        }
        .phone-glow {
          position: absolute;
          inset: -20px;
          background: radial-gradient(circle, rgba(0, 180, 220, 0.35) 0%, transparent 70%);
          border-radius: 60px;
          filter: blur(35px);
          z-index: 0;
        }
        .phone-img {
          position: relative;
          z-index: 1;
          max-height: 820px;
          width: auto;
          border-radius: 46px;
          box-shadow: 0 35px 80px -15px rgba(0, 0, 0, 0.85),
                      0 0 0 1px rgba(255, 255, 255, 0.15);
        }
      </style>

      <div
        id="root"
        data-composition-id="proof"
        data-width="1920"
        data-height="1080"
        data-duration="5.2"
      >
        <div class="bg-canvas"></div>
        <div class="ambient-orb orb-1" data-layout-allow-overflow></div>
        <div class="grid-overlay"></div>

        <div class="scene-container">
          <div id="s3-text-col">
            <div id="s3-badge" class="badge">
              <span class="badge-dot"></span>
              Social Accountability
            </div>
            <h2 class="headline-huge">
              Friends verify. <br />
              <span class="headline-accent">Or you pay.</span>
            </h2>
            <div class="steps-list">
              <div id="s3-step-1" class="step-item">
                <div class="step-num">1</div>
                <div>
                  <div class="step-text-title">Add your friends as verifiers</div>
                  <div class="step-text-desc">Invite your mates to keep you honest and call out excuses.</div>
                </div>
              </div>
              <div id="s3-step-2" class="step-item">
                <div class="step-num">2</div>
                <div>
                  <div class="step-text-title">Submit real proof</div>
                  <div class="step-text-desc">Upload a photo or receipt before your timer runs out.</div>
                </div>
              </div>
              <div id="s3-step-3" class="step-item">
                <div class="step-num">3</div>
                <div>
                  <div class="step-text-title">Get verified (or pay up)</div>
                  <div class="step-text-desc">If they approve, you keep your cash. If not, pay up.</div>
                </div>
              </div>
            </div>
          </div>

          <div id="s3-phone-col" class="phone-wrapper">
            <div class="phone-glow" data-layout-allow-overflow></div>
            <img id="s3-phone-img" class="phone-img" src="assets/images/task_verification_mockup.png" alt="Verification Mockup" />
          </div>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });

        // Entrance
        tl.fromTo("#s3-badge", { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 0.1);
        tl.fromTo("#s3-text-col h2", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.55, ease: "power2.out" }, 0.2);
        tl.fromTo("#s3-phone-col", { opacity: 0, x: 70, scale: 0.95 }, { opacity: 1, x: 0, scale: 1, duration: 0.7, ease: "power3.out" }, 0.25);

        // Steps staggered reveal
        tl.fromTo("#s3-step-1", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, 0.4);
        tl.fromTo("#s3-step-2", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, 0.85);
        tl.fromTo("#s3-step-3", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, 1.3);

        // Phone pulse on verification success at 2.7s
        tl.to("#s3-phone-img", { scale: 1.05, duration: 0.2, yoyo: true, repeat: 1, ease: "power2.out" }, 2.7);

        // Exit
        tl.to("#s3-text-col", { opacity: 0, y: -25, duration: 0.3, ease: "power2.in" }, 4.9);
        tl.to("#s3-phone-col", { opacity: 0, scale: 0.94, duration: 0.3, ease: "power2.in" }, 4.9);

        window.__timelines["proof"] = tl;
        tl.seek(0);
      </script>
    </template>
  </body>
</html>
