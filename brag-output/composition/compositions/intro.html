<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          overflow: hidden;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
          color: #ffffff;
        }
        .bg-canvas {
          position: absolute;
          inset: 0;
          background: radial-gradient(circle at 75% 30%, #003a4a 0%, #002530 40%, #00151c 80%, #000d12 100%);
          z-index: 0;
        }
        .ambient-orb {
          position: absolute;
          border-radius: 50%;
          filter: blur(120px);
          pointer-events: none;
          opacity: 0.55;
        }
        .orb-1 {
          width: 700px;
          height: 700px;
          top: -120px;
          right: -50px;
          background: radial-gradient(circle, rgba(0, 164, 198, 0.45) 0%, rgba(35, 101, 151, 0) 70%);
        }
        .grid-overlay {
          position: absolute;
          inset: 0;
          background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                            linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
          background-size: 64px 64px;
          opacity: 0.7;
          z-index: 1;
        }
        .scene-container {
          position: absolute;
          inset: 0;
          z-index: 2;
          display: grid;
          grid-template-columns: 1.15fr 0.85fr;
          align-items: center;
          gap: 80px;
          padding: 80px 140px;
        }
        .badge {
          display: inline-flex;
          align-items: center;
          gap: 10px;
          padding: 10px 22px;
          border-radius: 9999px;
          background: rgba(0, 164, 198, 0.18);
          border: 1px solid rgba(0, 190, 230, 0.45);
          color: #38bdf8;
          font-size: 19px;
          font-weight: 700;
          letter-spacing: 0.12em;
          text-transform: uppercase;
          margin-bottom: 24px;
        }
        .badge-dot {
          width: 10px;
          height: 10px;
          border-radius: 50%;
          background: #00d2f8;
          box-shadow: 0 0 12px #00d2f8;
        }
        .headline-huge {
          font-size: 82px;
          font-weight: 800;
          line-height: 1.05;
          letter-spacing: -0.03em;
          color: #ffffff;
          margin-bottom: 24px;
        }
        .headline-accent {
          color: #38bdf8;
          text-shadow: 0 0 35px rgba(56, 189, 248, 0.35);
        }
        .subtitle-lg {
          font-size: 30px;
          line-height: 1.4;
          color: #e2e8f0;
          max-width: 680px;
        }
        .phone-wrapper {
          display: flex;
          align-items: center;
          justify-content: center;
          position: relative;
        }
        .phone-glow {
          position: absolute;
          inset: -20px;
          background: radial-gradient(circle, rgba(0, 180, 220, 0.35) 0%, transparent 70%);
          border-radius: 60px;
          filter: blur(35px);
          z-index: 0;
        }
        .phone-img {
          position: relative;
          z-index: 1;
          max-height: 820px;
          width: auto;
          border-radius: 46px;
          box-shadow: 0 35px 80px -15px rgba(0, 0, 0, 0.85),
                      0 0 0 1px rgba(255, 255, 255, 0.15);
        }
      </style>

      <div
        id="root"
        data-composition-id="intro"
        data-width="1920"
        data-height="1080"
        data-duration="3.8"
      >
        <div class="bg-canvas"></div>
        <div class="ambient-orb orb-1" data-layout-allow-overflow></div>
        <div class="grid-overlay"></div>

        <div class="scene-container">
          <div id="s1-text-col">
            <div id="s1-badge" class="badge">
              <span class="badge-dot"></span>
              Attention Uni Students
            </div>
            <h1 class="headline-huge">
              Stop <br />
              <span id="s1-rotating-word" class="headline-accent">procrastinating.</span>
            </h1>
            <p id="s1-subtitle" class="subtitle-lg">
              You suck at keeping yourself accountable.<br />
              Your friends aren't forgiving. Neither is your wallet.
            </p>
          </div>

          <div id="s1-phone-col" class="phone-wrapper">
            <div class="phone-glow" data-layout-allow-overflow></div>
            <img class="phone-img" src="assets/images/task_mainscreen_mockup.png" alt="Ante Tasks Mockup" />
          </div>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });

        // Entrance
        tl.fromTo("#s1-badge", { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.2);
        tl.fromTo("#s1-text-col h1", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.35);
        tl.fromTo("#s1-subtitle", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.5);
        tl.fromTo("#s1-phone-col", { opacity: 0, x: 80, scale: 0.96 }, { opacity: 1, x: 0, scale: 1, duration: 0.8, ease: "power3.out" }, 0.4);

        // Word switch at 1.8s
        tl.to("#s1-rotating-word", {
          opacity: 0,
          y: -15,
          duration: 0.22,
          ease: "power2.in",
          onComplete: () => {
            const el = document.getElementById("s1-rotating-word");
            if (el) el.textContent = "scrolling.";
          }
        }, 1.8);
        tl.fromTo("#s1-rotating-word", { opacity: 0, y: 15 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 2.05);

        // Exit
        tl.to("#s1-text-col", { opacity: 0, y: -25, duration: 0.3, ease: "power2.in" }, 3.5);
        tl.to("#s1-phone-col", { opacity: 0, scale: 0.94, duration: 0.3, ease: "power2.in" }, 3.5);

        window.__timelines["intro"] = tl;
        tl.seek(0);
      </script>
    </template>
  </body>
</html>
